openapi: 3.2.0
info:
  title: VoyantIO Auth API
  description: '## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.'
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: Auth
paths:
  /auth/me:
    get:
      summary: Get Current User Info
      operationId: get_current_user_info_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
      tags:
      - Auth
  /auth/health:
    get:
      summary: Auth Health
      operationId: auth_health_auth_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Auth
components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
