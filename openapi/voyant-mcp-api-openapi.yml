openapi: 3.2.0
info:
  title: VoyantIO MCP API
  description: '## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.'
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: MCP
  description: Model Context Protocol server. Expose your context to AI agents (Claude Code, Cursor, etc).
paths:
  /mcp/sse:
    get:
      tags:
      - MCP
      summary: Mcp Sse
      description: SSE endpoint for MCP protocol.
      operationId: mcp_sse_mcp_sse_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /mcp/messages:
    post:
      tags:
      - MCP
      summary: Mcp Messages
      description: Message handling endpoint for MCP protocol.
      operationId: mcp_messages_mcp_messages_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /mcp/health:
    get:
      tags:
      - MCP
      summary: Mcp Health
      description: Health check endpoint.
      operationId: mcp_health_mcp_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /mcp/tools:
    get:
      tags:
      - MCP
      summary: Mcp Tools
      description: List available tools.
      operationId: mcp_tools_mcp_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
