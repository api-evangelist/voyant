openapi: 3.2.0
info:
  title: VoyantIO Notion Auth API
  description: '## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.'
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: notion-auth
  description: Notion OAuth authentication flow.
paths:
  /api/auth/notion/authorize:
    post:
      tags:
      - notion-auth
      summary: Authorize Notion
      description: Start Notion OAuth flow
      operationId: authorize_notion_api_auth_notion_authorize_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/auth/notion/callback:
    post:
      tags:
      - notion-auth
      summary: Notion Callback
      description: Handle Notion OAuth callback
      operationId: notion_callback_api_auth_notion_callback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api__notion_integration__CallbackRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/notion/disconnect:
    post:
      tags:
      - notion-auth
      summary: Disconnect Notion
      description: Disconnect Notion workspace
      operationId: disconnect_notion_api_auth_notion_disconnect_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
components:
  schemas:
    api__notion_integration__CallbackRequest:
      properties:
        code:
          type: string
          title: Code
        state:
          type: string
          title: State
      type: object
      required:
      - code
      - state
      title: CallbackRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
