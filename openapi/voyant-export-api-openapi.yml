openapi: 3.2.0
info:
  title: VoyantIO Export API
  description: '

    ## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.


    ### Core Capabilities


    - **Context Streams** - Centralized brand knowledge that any AI tool can use

    - **Telemetry** - Visitor tracking with IP geolocation and company enrichment

    - **Signals** - Social listening across 10+ platforms: GitHub, Reddit, HackerNews, LinkedIn, Twitter/X, Discord, ProductHunt, YouTube, G2, Slack, and government sources

    - **Target Graph** - Account and contact intelligence with engagement tracking

    - **RAG** - Retrieval-augmented content generation with brand awareness


    ### Authentication


    Most endpoints require a Bearer token from Clerk authentication.

    Public endpoints (telemetry ingestion, well-known files) are clearly marked.


    ### Rate Limits


    - Telemetry ingestion: 100 req/min per IP

    - API endpoints: 1000 req/min per org

    '
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: export
  description: General export functionality.
paths:
  /export/document:
    post:
      tags:
      - export
      summary: Export Document
      description: Export document to Google Drive
      operationId: export_document_export_document_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api__export__ExportResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /export/history:
    get:
      tags:
      - export
      summary: Get Export History
      description: Get export history for user
      operationId: get_export_history_export_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ExportRequest:
      properties:
        title:
          type: string
          title: Title
        content:
          type: string
          title: Content
        format:
          type: string
          title: Format
          default: docx
        export_to_drive:
          type: boolean
          title: Export To Drive
          default: true
      type: object
      required:
      - title
      - content
      title: ExportRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    api__export__ExportResponse:
      properties:
        success:
          type: boolean
          title: Success
        message:
          type: string
          title: Message
        export_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Export Id
        google_drive_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Google Drive Url
      type: object
      required:
      - success
      - message
      title: ExportResponse
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
