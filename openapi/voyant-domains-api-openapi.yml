openapi: 3.2.0
info:
  title: VoyantIO Domains API
  description: '## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.'
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: Domains
  description: Domain management for crawling and monitoring.
paths:
  /api/domains:
    get:
      tags:
      - Domains
      summary: List Domains
      description: Return the domains that already exist in the content index for this org.
      operationId: list_domains_api_domains_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Domains Api Domains Get
      security:
      - HTTPBearer: []
components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
