openapi: 3.2.0
info:
  title: VoyantIO Capture Session API
  description: '## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.'
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: Capture Session
paths:
  /capture-session:
    post:
      summary: Capture Session
      description: Capture LinkedIn session data from Chrome extension.
      operationId: capture_session_capture_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCaptureRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Capture Session
components:
  schemas:
    SessionCaptureRequest:
      properties:
        cookies:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Cookies
        url:
          type: string
          title: Url
        userAgent:
          type: string
          title: Useragent
        timestamp:
          type: integer
          title: Timestamp
      type: object
      required:
      - cookies
      - url
      - userAgent
      - timestamp
      title: SessionCaptureRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
