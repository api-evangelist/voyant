openapi: 3.2.0
info:
  title: VoyantIO Cncf Landscape API
  description: '

    ## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.


    ### Core Capabilities


    - **Context Streams** - Centralized brand knowledge that any AI tool can use

    - **Telemetry** - Visitor tracking with IP geolocation and company enrichment

    - **Signals** - Social listening across 10+ platforms: GitHub, Reddit, HackerNews, LinkedIn, Twitter/X, Discord, ProductHunt, YouTube, G2, Slack, and government sources

    - **Target Graph** - Account and contact intelligence with engagement tracking

    - **RAG** - Retrieval-augmented content generation with brand awareness


    ### Authentication


    Most endpoints require a Bearer token from Clerk authentication.

    Public endpoints (telemetry ingestion, well-known files) are clearly marked.


    ### Rate Limits


    - Telemetry ingestion: 100 req/min per IP

    - API endpoints: 1000 req/min per org

    '
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: cncf-landscape
  description: CNCF Landscape data for cloud-native ecosystem context.
paths:
  /api/cncf-landscape/normalize:
    post:
      tags:
      - cncf-landscape
      summary: Normalize Landscape
      operationId: normalize_landscape_api_cncf_landscape_normalize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LandscapeNormalizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Normalize Landscape Api Cncf Landscape Normalize Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/cncf-landscape/health:
    get:
      tags:
      - cncf-landscape
      summary: Health
      operationId: health_api_cncf_landscape_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api Cncf Landscape Health Get
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    LandscapeNormalizeRequest:
      properties:
        data:
          additionalProperties: true
          type: object
          title: Data
          description: CNCF landscape JSON payload
      type: object
      required:
      - data
      title: LandscapeNormalizeRequest
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
