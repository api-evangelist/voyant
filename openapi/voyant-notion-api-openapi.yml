openapi: 3.2.0
info:
  title: VoyantIO Notion API
  description: '## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.'
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: notion
  description: Notion workspace integration for content sync.
paths:
  /api/notion/status:
    get:
      tags:
      - notion
      summary: Get Notion Status
      description: Get Notion connection status
      operationId: get_notion_status_api_notion_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/notion/config:
    put:
      tags:
      - notion
      summary: Update Notion Config
      description: Update Notion sync configuration
      operationId: update_notion_config_api_notion_config_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotionConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/notion/sync:
    post:
      tags:
      - notion
      summary: Sync Notion
      description: Manually trigger Notion sync
      operationId: sync_notion_api_notion_sync_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
components:
  schemas:
    NotionConfig:
      properties:
        sync_enabled:
          type: boolean
          title: Sync Enabled
          default: false
        sync_frequency:
          type: string
          title: Sync Frequency
          default: daily
        selected_databases:
          items:
            type: string
          type: array
          title: Selected Databases
          default: []
      type: object
      title: NotionConfig
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
