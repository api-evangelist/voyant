openapi: 3.2.0
info:
  title: VoyantIO Content Search API
  description: '## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.'
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: Content Search
  description: Semantic search across all crawled and uploaded content.
paths:
  /api/content/search:
    post:
      tags:
      - Content Search
      summary: Search Content
      description: Basic content search for the UI. Currently uses the simple content summary.
      operationId: search_content_api_content_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    ContentSearchRequest:
      properties:
        query:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
          description: Keyword query
        domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Domain
          description: Domain filter
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
          description: Content type filter
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          description: Max results
          default: 10
        offset:
          type: integer
          minimum: 0.0
          title: Offset
          description: Pagination offset (ignored for now)
          default: 0
      type: object
      title: ContentSearchRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
