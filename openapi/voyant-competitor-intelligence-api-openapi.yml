          title: Competitors
        run_initial_scan:
          type: boolean
          title: Run Initial Scan
          default: true
      type: object
      required:
      - competitors
      title: AddMultipleCompetitorsRequest
    ResolveRequest:
      properties:
        text:
          type: string
          minLength: 1
          title: Text
          description: Text containing company mention
        source:
          type: string
          title: Source
