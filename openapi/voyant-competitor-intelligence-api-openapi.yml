openapi: 3.2.0
info:
  title: VoyantIO Competitor Intelligence API
  description: '

    ## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.


    ### Core Capabilities


    - **Context Streams** - Centralized brand knowledge that any AI tool can use

    - **Telemetry** - Visitor tracking with IP geolocation and company enrichment

    - **Signals** - Social listening across 10+ platforms: GitHub, Reddit, HackerNews, LinkedIn, Twitter/X, Discord, ProductHunt, YouTube, G2, Slack, and government sources

    - **Target Graph** - Account and contact intelligence with engagement tracking

    - **RAG** - Retrieval-augmented content generation with brand awareness


    ### Authentication


    Most endpoints require a Bearer token from Clerk authentication.

    Public endpoints (telemetry ingestion, well-known files) are clearly marked.


    ### Rate Limits


    - Telemetry ingestion: 100 req/min per IP

    - API endpoints: 1000 req/min per org

    '
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: Competitor Intelligence
  description: Deep competitor analysis including feature comparisons and win/loss patterns.
paths:
  /api/competitors/resolve:
    post:
      tags:
      - Competitor Intelligence
      summary: Resolve Company Mention
      description: 'Resolve a text mention to a canonical competitor.


        Uses the company identity system to match mentions across channels.

        Handles disambiguation for ambiguous names (Snowflake, Oracle, Box, etc.)'
      operationId: resolve_company_mention_api_competitors_resolve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/competitors/resolve/batch:
    post:
      tags:
      - Competitor Intelligence
      summary: Resolve Company Mentions Batch
      description: 'Resolve multiple mentions in batch.


        Efficient for processing feeds of content.'
      operationId: resolve_company_mentions_batch_api_competitors_resolve_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveBatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
