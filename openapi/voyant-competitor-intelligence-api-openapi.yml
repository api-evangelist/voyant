  /api/competitors/github/search:
    get:
      tags:
      - Competitor Intelligence
      summary: Search Github Organizations
      description: 'Search GitHub for organizations and users matching a pattern.


        Examples:

        - /github/search?pattern=confluent -> finds confluentinc, confluent-*, etc.

        - /github/search?pattern=redpanda* -> finds redpanda-data, redpandadata, etc.

        - /github/search?pattern=stripe -> finds stripe, stripe-*, etc.


        Returns organizations/users with their repos, stars, and metadata.'
      operationId: search_github_organizations_api_competitors_github_search_get
      security:
      - HTTPBearer: []
      parameters:
      - name: pattern
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          description: Search pattern (e.g., 'confluent' or 'confluent*')
          title: Pattern
        description: Search pattern (e.g., 'confluent' or 'confluent*')
      - name: include_users
        in: query
        required: false
        schema:
          type: boolean
          description: Include user accounts (many companies use these)
          default: true
          title: Include Users
        description: Include user accounts (many companies use these)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 25
          minimum: 1
          default: 10
          title: Limit
