          - type: string
          - type: 'null'
          title: Name
        tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Tier
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        categories:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Categories
        scan_frequency_hours:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scan Frequency Hours
        search_terms:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Search Terms
        search_exclusions:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Search Exclusions
        github_org:
          anyOf:
          - type: string
          - type: 'null'
          title: Github Org
        youtube_channel_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Youtube Channel Url
        twitter_handle:
          anyOf:
          - type: string
          - type: 'null'
          title: Twitter Handle
        blog_rss_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Blog Rss Url
        linkedin_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Linkedin Url
        events_page_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Events Page Url
        careers_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Careers Url
        sitemap_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Sitemap Url
      type: object
      title: UpdateCompetitorRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ResolveBatchRequest:
      properties:
        items:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Items
          description: List of items to resolve
        text_key:
          type: string
          title: Text Key
          default: title
        source_key:
          type: string
          title: Source Key
          default: source
      type: object
      required:
      - items
