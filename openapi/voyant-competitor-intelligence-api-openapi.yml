          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/competitors/discover/stream:
    get:
      tags:
      - Competitor Intelligence
      summary: Discover Competitors Stream
      description: 'Stream competitive landscape analysis using org context.


        Uses existing context streams to reason about who competitors are and why.

        Streams reasoning text followed by structured competitor data.

        Auto-saves the analysis to competitive_landscape_analyses table.


        Response format (SSE):

        - reasoning:text chunks as Claude thinks

        - competitors:JSON array when complete

        - error:message if something fails'
      operationId: discover_competitors_stream_api_competitors_discover_stream_get
      security:
      - HTTPBearer: []
      parameters:
      - name: additional_context
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Extra context for pivots/changes
          title: Additional Context
        description: Extra context for pivots/changes
      - name: competitors
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated confirmed competitor names — analysis focuses on these instead of discovering
          title: Competitors
        description: Comma-separated confirmed competitor names — analysis focuses on these instead of discovering
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
