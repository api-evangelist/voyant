components:
  schemas:
    SaveStrategyAnalysisRequest:
      properties:
        reasoning_text:
          type: string
          title: Reasoning Text
          description: The full AI strategy analysis text
      type: object
      required:
      - reasoning_text
      title: SaveStrategyAnalysisRequest
      description: Request to save a competitor strategy analysis.
    Body_analyze_g2_themes_api_competitors__competitor_id__g2_analyze_themes_post:
      properties:
        force_refresh:
          type: boolean
          title: Force Refresh
          default: false
        max_reviews:
          type: integer
          maximum: 500.0
          minimum: 10.0
          title: Max Reviews
          default: 100
      type: object
      title: Body_analyze_g2_themes_api_competitors__competitor_id__g2_analyze_themes_post
    CompetitorSummary:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        domain:
          type: string
          title: Domain
        tier:
          type: string
          title: Tier
        cadence_grade:
          anyOf:
          - type: string
          - type: 'null'
          title: Cadence Grade
        agent_readiness_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Agent Readiness Score
        employee_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Employee Count
        last_scan:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Scan
      type: object
      required:
      - id
      - name
      - domain
      - tier
      - cadence_grade
      - agent_readiness_score
      - employee_count
      - last_scan
      title: CompetitorSummary
    DiscoverCompetitorsRequest:
      properties:
        additional_context:
          anyOf:
          - type: string
          - type: 'null'
          title: Additional Context
      type: object
      title: DiscoverCompetitorsRequest
    Body_create_topics_from_g2_themes_api_competitors__competitor_id__g2_create_topics_post:
      properties:
        theme_types:
          items:
            type: string
          type: array
          title: Theme Types
          default:
          - positive
          - negative
        theme_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Theme Names
      type: object
      title: Body_create_topics_from_g2_themes_api_competitors__competitor_id__g2_create_topics_post
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Body_link_g2_product_api_competitors__competitor_id__g2_link_post:
      properties:
        g2_product_id:
          type: string
          title: G2 Product Id
        g2_product_slug:
          anyOf:
          - type: string
          - type: 'null'
          title: G2 Product Slug
      type: object
      required:
      - g2_product_id
      title: Body_link_g2_product_api_competitors__competitor_id__g2_link_post
    AddCompetitorRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        domain:
          type: string
          maxLength: 255
          minLength: 3
          title: Domain
        tier:
          type: string
          title: Tier
          default: disruptor
        categories:
          items:
            type: string
          type: array
          title: Categories
          default: []
