  /api/competitors/resolve/suggest:
    get:
      tags:
      - Competitor Intelligence
      summary: Suggest Competitor Matches
      description: 'Get multiple possible competitor matches with confidence scores.


        Useful for:

        - UI autocomplete/suggestions

        - Manual disambiguation when confidence is low'
      operationId: suggest_competitor_matches_api_competitors_resolve_suggest_get
      security:
      - HTTPBearer: []
      parameters:
      - name: text
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          title: Text
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 5
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
