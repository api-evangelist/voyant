        additional_context:
          anyOf:
          - type: string
          - type: 'null'
          title: Additional Context
          description: User-provided context
      type: object
      required:
      - reasoning_text
      title: SaveLandscapeAnalysisRequest
      description: Request to save a competitive landscape analysis.
