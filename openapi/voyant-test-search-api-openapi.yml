openapi: 3.2.0
info:
  title: VoyantIO Test Search API
  description: '## Brand Context Intelligence Platform


    VoyantIO provides AI-powered brand context management for GTM teams.'
  version: 1.0.0
servers:
- url: https://voice-forge-production.up.railway.app
  description: Production
tags:
- name: Test Search
paths:
  /test-search:
    post:
      summary: Test Search
      description: 'Test LinkedIn search functionality using captured session.

        This is a placeholder - you''ll need to implement actual LinkedIn API integration.'
      operationId: test_search_test_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Test Search
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TestSearchRequest:
      properties:
        query:
          type: string
          title: Query
        maxResults:
          type: integer
          title: Maxresults
          default: 3
      type: object
      required:
      - query
      title: TestSearchRequest
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
