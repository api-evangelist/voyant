aid: voyant
name: Voyant.io
description: >-
  Voyant.io is a brand-context platform that turns a company's positioning, messaging, personas,
  products, pricing, and competitive intelligence into structured "context streams" that any AI tool
  or agent can read at generation time, so AI-produced copy stays on-message instead of drifting or
  hallucinating claims. The product is delivered as a large FastAPI-based REST API (783 operations
  across 79 tags covering context streams, RAG search, messaging frameworks, target graph, telemetry,
  social signal harvesting, competitive intelligence, and content generation), a hosted MCP server
  exposing 15 tools to agent clients, and a set of published agent-governance files
  (`/.well-known/llms.txt`, `/.well-known/context.txt`) that declare training permissions and
  inference-control rules for the domain itself. Marketed to B2B GTM teams scaling from $5M to $100M
  ARR. Pre-seed, founded by Andrew M. Brown; the API runs under the internal name "VoiceForge".
