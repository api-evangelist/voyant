  - name: Voyant MCP Server
    description: >-
      Hosted Model Context Protocol server (`voyant-mcp` 1.1.0) exposing 15 tools that let an agent
      client pull the organization's brand context, persona/funnel-modulated context, positioning,
      messaging, personas, products, use cases, industries, testimonials, competitive intelligence,
      market signals, and RAG search results, plus a content-generation tool. Tool list and input
      schemas are readable anonymously at `/mcp/tools`; calling a tool requires a `vio_*` API key or
      a Clerk token. SSE and JSON-RPC message transports.
    humanURL: https://voice-forge-production.up.railway.app/mcp/tools
