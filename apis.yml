        url: mcp/voyant-mcp.yml
      - type: ToolCrosswalk
        url: mcp/voyant-tool-crosswalk.yml
  - name: Gypsum Context API
    description: >-
      Second OpenAPI published by Voyant.io, discovered 2026-08-13 at
      https://www.voyant.io/openapi-gypsum.json (HTTP 200, application/json, 36,964 bytes). A
      clean 26-operation, 7-tag cut of the brand-context surface — messaging, positioning,
      personas, products, use cases, industries and testimonials context reads, plus ICP CRUD,
      campaign management and a brand-aware AI chat endpoint. Ownership is proven by the spec's
      own contents: info.contact.name "VoyantIO", info.contact.url https://voyant.io, and a
      first-party servers[] host. IMPORTANT — the declared production host `gypsum.voyant.io`
      does NOT resolve (NXDOMAIN from both 8.8.8.8 and 1.1.1.1, while the apex voyant.io resolves
      to 76.76.21.21), so this contract is real and first-party but currently has no callable
      address. The spec declares no securitySchemes at all; auth is described in prose only, as a
      `user_id` query parameter carrying the Clerk organization ID.
    humanURL: https://www.voyant.io/openapi-gypsum.json
    baseURL: https://gypsum.voyant.io
    tags:
