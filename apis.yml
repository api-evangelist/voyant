apis:
  - name: VoyantIO API
    description: >-
      REST API for the Voyant brand-context platform, published as OpenAPI 3.1.0 with 783 operations
      over 79 tags. Covers context streams and context modulation, RAG ingestion and semantic search,
      the messaging framework (positioning, personas, products, use cases, industries, testimonials),
      target graph and CRM context, telemetry and attribution, social signal harvesting (GitHub,
      Reddit, HackerNews, LinkedIn, YouTube, G2, Discord, government sources), competitive
      intelligence and battlecards, GEO/AEO intelligence, content and video generation, and
      generation of agent-facing artifacts (llms.txt, context.txt, trust.txt, ontology.jsonld) for
      the customer's own domain. Bearer-token authenticated.
    humanURL: https://voice-forge-production.up.railway.app/docs
    baseURL: https://voice-forge-production.up.railway.app
    tags:
      - artificial-intelligence
      - context-management
      - brand-governance
