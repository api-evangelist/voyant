envelope:
  shape: '{"detail": <string | array of ValidationError>}'
  media_type: application/json
  rfc9457: false
  note: >-
    Voyant does not use RFC 9457 problem+json. The envelope is FastAPI's default single `detail`
    key, which is a string for HTTP exceptions and an array of {loc, msg, type} objects for
    validation failures. There is no error code, no type URI, and no correlation id — an agent has
    only the free-text `detail` string to branch on.
