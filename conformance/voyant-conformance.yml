  note: >-
    No trust center, no compliance page, no named certification anywhere on voyant.io. The only
    compliance-shaped claim on the entire surface is inside the product's own generated output —
    `GET /api/well-known/trust.txt` emits `soc2_status: compliant` for the demo org, which is a
    template value the platform writes for a customer, not an assertion about Voyant. Deliberately
    NOT wired as a `Compliance` or `TrustCenter` pointer.
