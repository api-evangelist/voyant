compliance:
  published: false
  certifications: []
  note: >-
    No trust center, no compliance page, no named certification anywhere on voyant.io. The only
    compliance-shaped claim on the entire surface is inside the product's own generated output —
    `GET /api/well-known/trust.txt` emits `soc2_status: compliant` for the demo org, which is a
    template value the platform writes for a customer, not an assertion about Voyant. Deliberately
    NOT wired as a `Compliance` or `TrustCenter` pointer.
agent_governance:
  published: true
  documents:
    - /.well-known/llms.txt
    - /.well-known/context.txt
  declared_but_missing:
    - agents.txt
    - trust.json
  note: >-
    Voyant publishes more agent-governance surface than almost any provider its size, and is one of
    the few in the catalog to serve an inference-control manifest at all. Two of the four files its
    own context.txt tells agents to consult are not served.
