observations:
  - >-
    Three overlapping definitions of "context" coexist — context-streams (harvested signal),
    context-graph / context-intelligence (derived relationships), and context-modulators (shaping
    rules). The API does not declare how they compose; the crosswalk shows MCP collapses all three
    into two tools.
  - >-
    Personas exist twice, under /api/messaging-framework/personas and /api/onboarding/personas,
    with separate CRUD. Whether these are the same rows is not documented.
  - >-
    No schema declares a `$ref` to another entity's canonical shape, so relationships here are
    inferred from id naming rather than asserted by the contract.
