note: >-
  Derived from the 266 component schemas and from the path/id-parameter graph. Voyant's OpenAPI is
  FastAPI-generated, so schemas are per-endpoint request/response DTOs rather than a normalized
  entity model — there is no `Persona` resource schema, only `PersonaCreate` / `PersonaResponse`
  shapes. The entities below are therefore inferred from the id parameters that appear across paths
  and from path roots, not read off a declared model.
tenancy:
