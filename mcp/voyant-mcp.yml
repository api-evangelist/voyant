  note: >-
    CORRECTED 2026-08-13. The 2026-08-12 catalog MCP census recorded `mode: none, probe: dead`
    because it POSTed JSON-RPC to https://voice-forge-production.up.railway.app/mcp and got
    `405 {"detail":"Method Not Allowed"}`. That is a transport mismatch, not a dead server:
    voyant-mcp speaks the LEGACY MCP HTTP+SSE transport, not Streamable HTTP, so there is no
    single POST-able /mcp endpoint by design. Re-probed today:
      GET  /mcp/sse      -> 200 text/event-stream  (session transport, live)
      GET  /mcp/health   -> 200 {"status":"healthy","tools_available":15,"active_sessions":0}
      GET  /mcp/tools    -> 200, 5,677 bytes, 15 tools WITH inputSchemas, anonymous
      POST /mcp/messages -> 400 {"error":"Invalid session"} (correct: needs a session from /mcp/sse)
      POST /mcp          -> 405 (no Streamable HTTP transport)
    An agent client configured for the legacy SSE transport reaches this server today; one
    configured only for Streamable HTTP cannot. That is the real finding, and it is a provider-side
    gap worth reporting: the modern transport is not implemented.
  previous:
    mode: none
    probe: dead
    checked: '2026-08-12'
    source: catalog MCP census
    superseded_by: live re-probe 2026-08-13
