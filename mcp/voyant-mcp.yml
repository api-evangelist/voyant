  introspection_gated: false
  note: >-
    The tool list AND the full inputSchema for every tool are readable anonymously at GET
    /mcp/tools — unusual and genuinely useful, since most hosted MCP servers in the catalog gate
    introspection behind auth. The JSON-RPC transport is session-scoped: POST /mcp/messages with
    {"jsonrpc":"2.0","method":"tools/list"} returns {"error":"Invalid session"} without a session
    established over /mcp/sse, so tool *invocation* is authenticated even though discovery is not.
