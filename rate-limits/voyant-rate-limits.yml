limit_count: 2
summary: >-
  Voyant publishes rate limits in exactly one place — a "### Rate Limits" section inside the
  OpenAPI `info.description` — and nowhere else. The numbers are real and specific, but they are
  prose inside a spec field, not headers, not a docs page, and not machine-readable. Separately,
  each pricing tier carries a monthly API-call allowance. Nothing about either is signalled at
  runtime: no RateLimit-*, no X-RateLimit-*, no Retry-After was observed on any probed response,
  so a client has no way to know how close it is to either ceiling until it is refused.
limits:
  - id: telemetry-ingestion
    scope: per-ip
    surface: telemetry ingestion endpoints
    limit: 100
    window: 1m
    unit: requests
    burst: null
    source: openapi info.description
    source_quote: 'Telemetry ingestion: 100 req/min per IP'
    note: >-
      Applies to the unauthenticated ingestion surface — POST /api/telemetry/track,
      POST /api/telemetry/end-session, POST /api/deo/ingest, POST /api/deo/v1/telemetry/events,
      POST /api/deo/v1/traces, POST /api/deo/mcp-telemetry — all of which declare no security in
      the contract. Per-IP is the only control on that surface.
  - id: api-endpoints
    scope: per-account
    scope_detail: per organization
    surface: all other API endpoints
    limit: 1000
    window: 1m
    unit: requests
    burst: null
    source: openapi info.description
    source_quote: 'API endpoints: 1000 req/min per org'
    note: >-
      Stated per org, not per key, so multiple API keys inside one organization share the ceiling.
      No per-endpoint carve-outs are published for the expensive operations (RAG generation,
      competitor scans, GEO/AEO scans), which are the ones most likely to need one.
quota_limits:
  unit: API call
  window: 1mo
  definition: >-
    "Each request to our Context API counts as one call. MCP queries, REST requests, and webhook
    deliveries are all included. Dashboard usage doesn't count against your limit."
  source: https://www.voyant.io/pricing
  by_plan:
    - plan: Starter
      api_calls_per_month: 5000
    - plan: Growth
      api_calls_per_month: 25000
    - plan: Scale
      api_calls_per_month: 100000
    - plan: Enterprise
      api_calls_per_month: null
      note: 'Published as "SLA-backed" with no number.'
  note: >-
    MCP tool calls are metered on the same counter as REST requests. At the Starter allowance of
    5,000 calls/month an agent doing per-turn context pulls exhausts the plan quickly, and the
    per-minute ceiling (1,000/min per org) is 12x the entire monthly Starter allowance — the
    binding constraint is the monthly quota, not the rate.
